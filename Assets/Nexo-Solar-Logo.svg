<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Nexo Solar — Monitoramento</title>
  <desc id="logo-description">Símbolo de uma folha verde com um raio branco, acima do nome Nexo Solar e da palavra Monitoramento.</desc>
  <defs>
    <linearGradient id="leaf-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79bf19"/>
      <stop offset="0.42" stop-color="#348b2d"/>
      <stop offset="1" stop-color="#124d2d"/>
    </linearGradient>
    <linearGradient id="leaf-light" x1="0" y1="0" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#8ed51b"/>
      <stop offset="1" stop-color="#62b82a"/>
    </linearGradient>
    <linearGradient id="leaf-middle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cae27"/>
      <stop offset="1" stop-color="#2b7d2d"/>
    </linearGradient>
    <linearGradient id="base-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#215a30"/>
      <stop offset="1" stop-color="#10482b"/>
    </linearGradient>
  </defs>

  <!-- Curva inferior, que dá ao símbolo sensação de movimento e fluxo de energia. -->
  <path d="M 399,565
           C 454,548 515,531 570,510
           C 606,496 633,479 648,465
           C 651,488 638,507 610,524
           C 563,552 493,568 399,565 Z"
        fill="url(#base-green)"/>

  <!-- Silhueta principal da folha. -->
  <path d="M 400,565
           C 385,527 377,481 383,436
           C 391,376 424,333 470,306
           C 518,278 556,260 568,183
           C 600,221 628,274 641,329
           C 657,396 642,459 603,507
           C 559,555 491,572 400,565 Z"
        fill="url(#leaf-main)"/>

  <!-- Faixa clara inspirada em uma folha nova. -->
  <path d="M 400,565
           C 390,522 389,472 405,428
           C 421,384 453,351 496,327
           C 532,307 555,273 568,183
           C 579,234 566,278 545,319
           C 525,359 493,389 467,418
           C 436,452 414,500 400,565 Z"
        fill="url(#leaf-light)"/>

  <!-- Nervura central que separa os tons de verde. -->
  <path d="M 400,565
           C 414,505 437,454 472,414
           C 514,366 555,322 568,183
           C 596,244 594,302 572,361
           C 551,415 514,455 476,492
           C 446,521 420,548 400,565 Z"
        fill="url(#leaf-middle)"/>

  <!-- Raio branco recortado no interior da folha. -->
  <path d="M 552,281
           L 495,380
           L 542,381
           L 421,515
           L 474,412
           L 428,412 Z"
        fill="#FFFFFF"/>

